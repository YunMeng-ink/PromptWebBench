<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Prompt Benchmark">
  <title>Prompt Benchmark</title>
  <!-- 墨色底：与站点的纸面与墨色体系一致，在浅色和深色浏览器栏上都清晰。 -->
  <rect width="32" height="32" rx="8" fill="#1a1815"/>
  <!-- 衬线体 P 的几何化写法：竖笔与碗形，避免依赖系统字体。 -->
  <path
    d="M11.4 24V8.8h5.4a4.6 4.6 0 0 1 0 9.2h-5.4"
    fill="none"
    stroke="#f7f6f3"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
  <!-- 莓红菱形：站内强调色与分类标记的同一形状，标记测量结果的区分点。 -->
  <path d="M23.2 20.6l2.6 2.6-2.6 2.6-2.6-2.6z" fill="#e06a88"/>
</svg>
