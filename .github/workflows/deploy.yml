name: Deploy
# 手动触发的自托管部署：在服务器上执行 deploy/update.sh，
# 从 GitHub Release 下载指定标签的二进制，校验和通过后原子替换并重启。
# 部署目标与密钥通过仓库 Secrets 提供（见 docs/部署手册.md 第十三节）：
#   DEPLOY_HOST      服务器地址（IP 或域名）
#   DEPLOY_USER      用于登录的账户（需 sudo 权限执行 systemctl）
#   DEPLOY_SSH_KEY   该账户的私钥（建议专用部署密钥，仅授权本仓库）
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要部署的发布标签（留空表示最新正式版）
        required: false
        default: ''
jobs:
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    steps:
      - name: 安装 SSH 密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: 下载并安装发布版本
        env:
          DEPLOY_TAG: ${{ github.event.inputs.tag }}
        run: |
          # 标签通过环境变量传给远端，避免其内容进入命令行。
          # 服务器上的仓库只用来取最新的 update.sh；二进制来自 Release，不依赖服务器上的 Go 与 Node。
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "TAG='${DEPLOY_TAG}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/prompt-benchmark
          git fetch --all --tags
          # 之前可能检出过某个标签，这里统一回到 main 再取最新脚本。
          git checkout main 2>/dev/null || git checkout -B main origin/main
          git pull --ff-only
          sudo -E env "TAG=${TAG}" deploy/update.sh
          REMOTE
