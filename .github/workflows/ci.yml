name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# 两个门禁与本地 Makefile 的 backend-gate / frontend-gate 完全对应。
# PostgreSQL 服务开启 trust 认证：后端集成测试连 `postgres` 维护库并各自建库销毁，
# 端到端测试经 psql 重建 prompt_benchmark_e2e，两者都不需要口令。
jobs:
  backend:
    name: 后端门禁
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: 运行后端门禁（格式、编译、静态检查、测试）
        env:
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: make backend-gate
  frontend:
    name: 前端门禁（含四浏览器 e2e）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 安装 psql 客户端与 Microsoft Edge
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc |
            sudo gpg --dearmor -o /usr/share/keyrings/microsoft-edge.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-edge.gpg] https://packages.microsoft.com/repos/edge stable main" |
            sudo tee /etc/apt/sources.list.d/microsoft-edge.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y microsoft-edge-stable
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: 安装 Playwright 浏览器（Firefox 与 WebKit）
        run: npx playwright install --with-deps firefox webkit
        working-directory: frontend
      - name: 运行前端门禁（lint、类型、单测、构建、四浏览器 e2e）
        env:
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: make frontend-gate
